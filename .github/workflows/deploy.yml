name: Deploy

on:
  workflow_dispatch: {}
  # push:
    # branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    env:
      SLIDES_BASE_PATH: "/${{ github.event.repository.name }}"
      SLIDES_PUBLIC_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      PUBLIC_PROTOMAPS_KEY: ${{ vars.PUBLIC_PROTOMAPS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up native renderer
        run: sudo sh packages/static-render/scripts/install-system-deps.sh

      - name: Build
        run: xvfb-run -a pnpm exec slides build ./content/gravity-at-sea --outDir dist/gravity-at-sea

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/gravity-at-sea
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
