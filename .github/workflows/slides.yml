name: Slides architecture
on:
  # Always report the required check, including documentation and version-only PRs.
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Include the PR merge parents for the version-only comparison.
          fetch-depth: 2
      - name: Detect changes that need testing
        id: changes
        # Manual runs and PRs beyond the API's 3,000-file limit run all tests.
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files <= 3000
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: .github/test-paths.yml
      - name: Check for version-only changes
        id: version
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.changed_files <= 3000 &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'changeset-release/main' &&
          steps.changes.outputs.tests != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-version-only.mjs "$BASE_SHA"
      - name: Documentation-only changes
        if: steps.changes.outputs.tests == 'false'
        run: echo "Documentation-only changes; integration tests were not needed." >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the integration presentation
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        run: git submodule update --init content/slides-template
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        with:
          version: 10.22.0
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Set up native renderer
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        run: sudo sh packages/static-render/scripts/install-system-deps.sh
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
      - name: Unit and component checks
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        run: |
          pnpm -r test
          pnpm --filter @allmaps/slides --filter @allmaps/iiif --filter @allmaps/static-render check
          pnpm check ./content/slides-template
      - name: Native pixel alignment
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        run: xvfb-run -a pnpm --filter @allmaps/static-render test:native
      - name: Independent development sites
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        run: pnpm --filter @allmaps/slides test:dev
      - name: Fresh installed consumer
        if: steps.changes.outputs.tests != 'false' && steps.version.outputs.only != 'true'
        run: xvfb-run -a pnpm --filter @allmaps/slides test:package
