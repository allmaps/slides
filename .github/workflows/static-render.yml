name: Static renderer
on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/slides/**"
      - "scripts/**"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/static-render.yml"
  workflow_dispatch:
jobs:
  container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image and run native smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/static-render/Dockerfile
          target: slides-build
          platforms: linux/amd64
          load: true
          tags: slides-renderer:check
          cache-from: type=gha,scope=slides-renderer
          cache-to: type=gha,mode=max,scope=slides-renderer
      - name: Check container entrypoint
        timeout-minutes: 1
        run: docker run --rm slides-renderer:check node packages/static-render/bin/render.mjs --help
