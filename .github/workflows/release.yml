name: Release notes

on:
  push:
    tags: ['@allmaps/slides@*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example @allmaps/slides@0.1.0-beta.1)
        required: true
        type: string

concurrency:
  group: release-notes-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Extract notes for the tagged version
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/release-notes.mjs > "$RUNNER_TEMP/slides-release-notes.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/slides-release-notes.md")
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
