name: Publish release

on:
  push:
    branches: [main]
    tags: ['@allmaps/slides@*']
    paths: ['packages/slides/package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag: repair GitHub release only. Leave empty to publish the current version on main.'
        required: false
        type: string
      sync_tags:
        description: 'Only repair npm tags for the already-published version on main; leave tag empty.'
        type: boolean
        default: false

concurrency:
  group: publish-slides
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.tag == ''
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check version and previous publication
        id: plan
        if: inputs.sync_tags != true
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node scripts/prepare-npm-release.mjs
      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.published == 'false'
      - name: Install npm with trusted publishing support
        if: steps.plan.outputs.release == 'true' || inputs.sync_tags == true
        # OIDC dist-tag authentication requires npm 11.21.0 or later.
        run: npm install --global 'npm@^11.21.0'
      - name: Install packaging dependencies
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.published == 'false'
        # Packaging does not run the native renderer or need content repositories.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and pack
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.published == 'false'
        # pnpm applies publishConfig.exports and removes workspace dependencies.
        run: pnpm --filter @allmaps/slides pack --out "$RUNNER_TEMP/slides.tgz"
      - name: Publish to npm
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.published == 'false'
        env:
          NPM_TAG: ${{ steps.plan.outputs.npmTag }}
        run: npm publish "$RUNNER_TEMP/slides.tgz" --access public --tag "$NPM_TAG" --provenance
      - name: Update npm distribution tags
        if: steps.plan.outputs.release == 'true' || inputs.sync_tags == true
        run: node scripts/sync-npm-tags.mjs
      - name: Create and push the release tag
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_TAG"
          fi
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG"

  notes:
    needs: publish
    # Tags pushed by GITHUB_TOKEN do not start another workflow; create the
    # release here too. User-pushed tags and manual repairs keep working.
    if: >-
      always() && !cancelled() &&
      ((needs.publish.result == 'success' && needs.publish.outputs.release == 'true') ||
       startsWith(github.ref, 'refs/tags/@allmaps/slides@') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.publish.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Extract notes for the tagged version
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/release-notes.mjs > "$RUNNER_TEMP/slides-release-notes.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/slides-release-notes.md")
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
